name: Validate VueConfort commercial app

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/commercial-android.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/commercial-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and compile commercial preview
        run: >-
          ./gradlew --no-daemon -PcommercialPreviewTests
          :app:testReleaseUnitTest :app:lintRelease :app:assemblePreview
          :app:assemblePreviewAndroidTest
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-validation-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
